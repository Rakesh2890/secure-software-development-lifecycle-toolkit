name: Secure SDLC Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  security-analysis:
    name: Build and Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: node --check server.js

      # =========================
      # SAST - SonarQube
      # =========================
      - name: SonarQube SAST Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # =========================
      # SCA - OWASP Dependency-Check
      # =========================
      - name: OWASP Dependency-Check SCA
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "secure-task-manager"
          path: "."
          format: "HTML"
          out: "dependency-check-reports"
          args: >
            --disableOssIndex
            --exclude node_modules
            --exclude .git
            --exclude dependency-check-reports

      - name: Upload OWASP Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: dependency-check-reports/

      # =========================
      # Secret Scanning - Gitleaks
      # =========================
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # Docker Build
      # =========================
      - name: Build Docker image
        run: docker build -t secure-task-manager:1.4 .

      # =========================
      # Container Security - Trivy
      # =========================
      - name: Trivy Container Scan - SARIF
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "secure-task-manager:1.4"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          ignore-unfixed: false

      # Upload Trivy SARIF results to GitHub Code Scanning
      - name: Upload Trivy SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container-scan

      # =========================
      # Trivy HTML Report
      # =========================
      - name: Trivy Container Scan - HTML
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "secure-task-manager:1.4"
          format: "template"
          template: "@/home/runner/.local/bin/trivy-bin/contrib/html.tpl"
          output: "trivy-report.html"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          ignore-unfixed: false

      - name: Upload Trivy HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-report
          path: trivy-report.html

      - name: Start Application for DAST
        run: |
          docker rm -f dast-target 2>/dev/null || true

          docker run -d \
            --name dast-target \
            -p 3001:3001 \
            secure-task-manager:1.4

          echo "Waiting for application to start..."

          for i in {1..30}; do
            if curl --fail http://localhost:3001/api/health; then
              echo "Application is ready!"
              exit 0
            fi

            sleep 2
          done

          echo "Application failed to start"
          docker logs dast-target
          exit 1

      - name: OWASP ZAP DAST Scan
        run: |
          mkdir -p zap-reports

          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3001 \
            -r /zap/wrk/zap-report.html \
            -J /zap/wrk/zap-report.json \
            -x /zap/wrk/zap-report.xml \
            -w /zap/wrk/zap-report.md \
            -I || true

          echo "Generated ZAP reports:"
          find zap-reports -maxdepth 1 -type f -print
          
      - name: Check ZAP Reports
        if: always()
        run: |
          echo "Contents of zap-reports:"
          ls -la zap-reports || true

      - name: Upload OWASP ZAP DAST Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-zap-dast-reports
          path: zap-reports/
          if-no-files-found: error

      - name: Stop DAST Application
        if: always()
        run: |
          docker stop dast-target || true
          docker rm dast-target || true