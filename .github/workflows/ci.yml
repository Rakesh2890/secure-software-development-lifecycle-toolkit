name: Secure SDLC Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-analysis:
    name: Build and Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: node --check server.js

      - name: SonarQube SAST Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: OWASP Dependency-Check SCA
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p dependency-check-reports

          docker run --rm \
            -e NVD_API_KEY="$NVD_API_KEY" \
            -v "${{ github.workspace }}:/src" \
            owasp/dependency-check:latest \
            --scan /src \
            --project "secure-task-manager" \
            --format HTML \
            --out /src/dependency-check-reports \
            --nvdApiKey "$NVD_API_KEY" \
            --exclude /src/node_modules \
            --exclude /src/dependency-check-reports \
            --exclude /src/.git \
            --disableOssIndex

      - name: Upload OWASP Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: dependency-check-reports/