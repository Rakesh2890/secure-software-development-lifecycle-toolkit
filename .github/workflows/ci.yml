name: Secure SDLC Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  security-analysis:
    name: Build and Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: node --check server.js

      # =========================
      # SAST - SonarQube
      # =========================
      - name: SonarQube SAST Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # =========================
      # SCA - OWASP Dependency-Check
      # =========================
      - name: OWASP Dependency-Check SCA
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "secure-task-manager"
          path: "."
          format: "HTML"
          out: "dependency-check-reports"
          args: >
            --disableOssIndex
            --exclude node_modules
            --exclude .git
            --exclude dependency-check-reports

      - name: Upload OWASP Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: dependency-check-reports/

      # =========================
      # Secret Scanning - Gitleaks
      # =========================
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # Docker Build
      # =========================
      - name: Build Docker image
        run: docker build -t secure-task-manager:1.2 .

      # =========================
      # Container Security - Trivy
      # =========================
      - name: Trivy Container Scan - SARIF
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "secure-task-manager:1.2"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          ignore-unfixed: false

      # Upload Trivy SARIF results to GitHub Code Scanning
      - name: Upload Trivy SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container-scan

      # =========================
      # Trivy HTML Report
      # =========================
      - name: Trivy Container Scan - HTML
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "secure-task-manager:1.2"
          format: "template"
          template: "@/contrib/html.tpl"
          output: "trivy-report.html"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          ignore-unfixed: false

      - name: Upload Trivy HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-report
          path: trivy-report.html

      - name: Upload Trivy JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-report
          path: trivy-report.json